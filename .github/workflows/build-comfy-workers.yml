name: Build ComfyUI worker images

# Manual only. These builds take 45–120+ minutes and need Docker Hub login
# to pull pavanalur3/deps-base-new:py311-cu128 and push quickpod_worker tags.
# Weights are NOT baked in. See .github/workflows/README-COMFY-BUILDS.md
on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which image to build and push
        type: choice
        required: true
        default: all
        options:
          - all
          - minimax_h3_comfy
          - ltx25_int8_comfy
          - qwen_image_21_turbo_comfy
          - minimax_music3_comfy

env:
  REGISTRY_IMAGE: pavanalur3/quickpod_worker

jobs:
  build:
    if: inputs.worker == 'all' || inputs.worker == matrix.worker
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: minimax_h3_comfy
            context: backend/quickpod_individual_worker/worker_minimax_h3_comfy
          - worker: ltx25_int8_comfy
            context: backend/quickpod_individual_worker/worker_ltx25_int8_comfy
          - worker: qwen_image_21_turbo_comfy
            context: backend/quickpod_individual_worker/worker_qwen_image_21_turbo_comfy
          - worker: minimax_music3_comfy
            context: backend/quickpod_individual_worker/worker_minimax_music3_comfy
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
          docker-images: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.worker }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.worker }}
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.worker }}-${{ github.sha }}
